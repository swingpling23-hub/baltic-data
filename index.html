<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baltic OSINT Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>

<body>

    <div class="dashboard-container">

        <!-- Övre vänster -->

        <section id="map-section" class="panel">

            <h2>Östersjön - Lägeskarta</h2>

            <div id="overview-map"></div>

        </section>

        <!-- Nedre vänster -->

        <section id="cables-section" class="panel">

            <h2>Högspänningskablar i Östersjön</h2>

            <div id="cable-map"></div>

        </section>

        <!-- Höger -->

        <section id="osint-section" class="panel">

            <h2>OSINT & Säkerhetsflöde</h2>

            <div class="tabs">

                <button class="tab-button active"
                    onclick="showTab('today')">
                    Idag
                </button>

                <button class="tab-button"
                    onclick="showTab('yesterday')">
                    Igår
                </button>

                <button class="tab-button"
                    onclick="showTab('older')">
                    Äldre
                </button>

            </div>

            <div id="today-feed"
                class="feed-container"></div>

            <div id="yesterday-feed"
                class="feed-container hidden"></div>

            <div id="older-feed"
                class="feed-container hidden"></div>

        </section>

    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>

</body>

</html>
